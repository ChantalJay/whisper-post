services:
  web:
    build: .
    command: ["node", "server.js"]
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment: &app-env
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /app/data
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in .env}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY in .env}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM in .env}
    volumes:
      - whisperpost-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

  worker:
    build: .
    command: ["node", "dist/worker/deliver-message.js"]
    restart: unless-stopped
    environment: *app-env
    volumes:
      - whisperpost-data:/app/data
    depends_on:
      web:
        condition: service_healthy

volumes:
  whisperpost-data:
